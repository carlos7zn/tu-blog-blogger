<!-- El Tiempo Local - Widget Obligatorio -->
<div style="padding:10px; text-align:center; background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; border-radius:8px;">
  <h3 style="color:#fff; margin-top:0;">🌦️ El Tiempo</h3>
  <div id="weather-widget">
    <span style="font-size:2em;">⛅</span>
    <div id="weather-temp" style="font-size:1.2em; font-weight:bold;">--°C</div>
    <div id="weather-desc" style="font-size:0.85em;">Cargando...</div>
    <div id="weather-city" style="font-size:0.8em; opacity:0.8;">Tu localidad</div>
  </div>
  <script>
    const SUPABASE_URL = 'https://ffiwqkvftwosybubnerh.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_t__IyaSL9g4v0HNNZjFk9Q_te0hZnos';

    async function cargarTiempo() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/weather?order=updated_at.desc&limit=1`, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (data.length === 0) {
          document.getElementById('weather-temp').textContent = '--°C';
          document.getElementById('weather-desc').textContent = 'Sin datos';
          document.getElementById('weather-city').textContent = 'N/A';
          return;
        }
        const row = data[0];
        document.getElementById('weather-temp').textContent = `${row.temp}°C`;
        document.getElementById('weather-desc').textContent = row.description || '--';
        document.getElementById('weather-city').textContent = row.city || '--';
      } catch (err) {
        console.error(err);
        document.getElementById('weather-temp').textContent = 'Error';
        document.getElementById('weather-desc').textContent = 'Error';
        document.getElementById('weather-city').textContent = 'Error';
      }
    }

    cargarTiempo();
    // Refresh every 10 minutes
    setInterval(cargarTiempo, 10 * 60 * 1000);
  </script>
</div>
