<!-- Contador de Visitas - Widget Obligatorio -->
<div style="padding:10px; text-align:center;">
  <h3>📊 Estadísticas</h3>
  <div class="counter">
    <span style="font-size:2em; font-weight:bold; color:#1a73e8;" id="visitCount">0</span>
    <div style="font-size:0.8em; color:#666;">visitas</div>
  </div>
</div>
<script>
  const SUPABASE_URL = 'https://ffiwqkvftwosybubnerh.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_t__IyaSL9g4v0HNNZjFk9Q_te0hZnos';

  async function updateVisitCount() {
    try {
      // Try to get existing visit count
      const getRes = await fetch(`${SUPABASE_URL}/rest/v1/visits?id=eq.1&select=count`, {
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
        }
      });
      if (!getRes.ok) {
        throw new Error(`Failed to get visits: ${getRes.status}`);
      }
      const data = await getRes.json();
      let count = 0;
      if (data.length > 0) {
        count = data[0].count;
      }
      count++;
      // Upsert
      const upsertRes = await fetch(`${SUPABASE_URL}/rest/v1/visits`, {
        method: data.length > 0 ? 'PATCH' : 'POST',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=representation'
        },
        body: JSON.stringify({ id: 1, count })
      });
      if (!upsertRes.ok) {
        throw new Error(`Failed to upsert visits: ${upsertRes.status}`);
      }
      const upsertData = await upsertRes.json();
      document.getElementById('visitCount').textContent = upsertData[0]?.count || 0;
    } catch (err) {
      console.error(err);
      document.getElementById('visitCount').textContent = 'Error';
    }
  }

  // Update on load
  updateVisitCount();
</script>
