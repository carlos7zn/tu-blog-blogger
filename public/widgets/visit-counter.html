<!-- Contador de Visitas - Widget Obligatorio -->
<div style="padding:10px; text-align:center;">
  <h3>📊 Estadísticas</h3>
  <!-- Blogger StatBadge integrado - reemplazar con tu ID de blog -->
  <div class="counter">
    <span style="font-size:2em; font-weight:bold; color:#1a73e8;" id="visitCount">0</span>
    <div style="font-size:0.8em; color:#666;">visitas</div>
  </div>
  <script>
    // Contador simple con localStorage (funciona sin backend)
    (function() {
      const key = 'blog_visits';
      let count = parseInt(localStorage.getItem(key) || '0');
      count++;
      localStorage.setItem(key, count);
      document.getElementById('visitCount').textContent = count;
    })();
  </script>
</div>
